<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Восстановление пароля — Саран</title>
<meta name="robots" content="noindex">
<style>
    @font-face {
        font-family: 'Vela Sans';
        src: url('fonts/VelaSans-SemiBold.otf') format('opentype');
        font-weight: 600;
        font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        min-height: 100vh;
        background: #0b0d12;
        color: #f2f2f7;
        font-family: 'Vela Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .card {
        width: 100%;
        max-width: 400px;
        padding: 28px 22px 26px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    h1 {
        margin: 0 0 6px;
        font-size: 20px;
        font-weight: 600;
    }
    p.lead {
        margin: 0 0 20px;
        font-size: 13px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.45);
    }
    .field { margin-bottom: 14px; }
    .field label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.38);
        margin-bottom: 6px;
    }
    .field input {
        width: 100%;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(0, 0, 0, 0.35);
        color: #f2f2f7;
        font-size: 15px;
        padding: 12px 14px;
        outline: none;
    }
    .field input:focus { border-color: rgba(130, 200, 255, 0.45); }
    button {
        width: 100%;
        margin-top: 6px;
        padding: 14px 16px;
        border: none;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.14);
        color: #f2f2f7;
        font-family: inherit;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .feedback {
        margin: 0 0 14px;
        font-size: 13px;
        line-height: 1.4;
    }
    .feedback.error { color: rgba(255, 160, 168, 0.95); }
    .feedback.ok { color: rgba(150, 235, 195, 0.95); }
    .back {
        display: block;
        margin-top: 16px;
        text-align: center;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.4);
        text-decoration: none;
    }
</style>
</head>
<body>
    <div class="card">
        <h1 id="title">Новый пароль</h1>
        <p class="lead" id="lead">Задайте новый пароль для входа в Саран.</p>
        <p class="feedback" id="feedback" hidden></p>
        <form id="form">
            <div class="field">
                <label for="password">Новый пароль</label>
                <input id="password" type="password" autocomplete="new-password" placeholder="Не менее 8 символов">
            </div>
            <div class="field">
                <label for="password2">Повторите пароль</label>
                <input id="password2" type="password" autocomplete="new-password" placeholder="Ещё раз">
            </div>
            <button type="submit" id="submit">Сохранить новый пароль</button>
        </form>
        <a class="back" href="/app/">← Вернуться в приложение</a>
    </div>

    <script src="js/saran-api.js"></script>
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('token');
            var feedback = document.getElementById('feedback');
            var form = document.getElementById('form');
            var submit = document.getElementById('submit');

            function setFeedback(msg, kind) {
                if (!feedback) return;
                if (!msg) {
                    feedback.hidden = true;
                    feedback.textContent = '';
                    return;
                }
                feedback.hidden = false;
                feedback.textContent = msg;
                feedback.className = 'feedback' + (kind ? ' ' + kind : '');
            }

            if (!token) {
                setFeedback('Ссылка недействительна: отсутствует токен. Запросите восстановление пароля заново в приложении.', 'error');
                if (submit) submit.disabled = true;
                return;
            }

            form.addEventListener('submit', function (ev) {
                ev.preventDefault();
                var p1 = document.getElementById('password').value.trim();
                var p2 = document.getElementById('password2').value.trim();
                if (p1.length < 8) {
                    setFeedback('Пароль должен быть не короче 8 символов', 'error');
                    return;
                }
                if (p1 !== p2) {
                    setFeedback('Пароли не совпадают', 'error');
                    return;
                }
                submit.disabled = true;
                setFeedback('');
                window.SaranAPI.resetPassword(token, p1)
                    .then(function () {
                        setFeedback('Пароль изменён. Теперь можно войти в приложении с новым паролем.', 'ok');
                        form.hidden = true;
                    })
                    .catch(function (err) {
                        setFeedback((err && err.message) || 'Ссылка недействительна или устарела. Запросите восстановление ещё раз.', 'error');
                        submit.disabled = false;
                    });
            });
        })();
    </script>
</body>
</html>
